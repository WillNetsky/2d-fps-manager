name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Run bundled JS actions on Node 24 (becomes the default June 2026). Covers
# actions/* still declaring node20, including upload-artifact used internally
# by upload-pages-artifact.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Allow the GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress run mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
